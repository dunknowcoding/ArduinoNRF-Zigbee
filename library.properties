name=NiusZigbee
version=0.2.4
author=dunknowcoding (NiusRobotLab)
maintainer=dunknowcoding
sentence=Drive external Zigbee / IEEE 802.15.4 radio modules (CC2530, ...) from an ArduinoNRF nRF52840 board.
paragraph=Host-side drivers for external 2.4 GHz IEEE 802.15.4 modules over a hardware UART. Ships an SDCC CC2530 MAC/PHY helper firmware with raw 802.15.4 send/receive, hardware PAN/address filtering, Auto ACK, CCA transmit, retries, promiscuous sniffing, short-address MAC, NWK data/command helpers, APS data-frame helpers, ZDO discovery helpers, a small local Device Object descriptor store, fixed neighbor/route tables, local network state and permit-join/address-allocation helpers, basic ZCL command-frame helpers, tiny reusable Basic / OnOff cluster behaviors, and boolean attribute reporting helpers. Flash the module firmware with the ArduinoNRF board package's built-in CC-Debugger - no external TI programmer required. Extensible to more modules and a future Z-Stack (full Zigbee PRO) backend.
category=Communication
url=https://github.com/dunknowcoding/ArduinoNRF-Zigbee
architectures=nrf52
includes=NiusZigbee.h,ArduinoNRF_Zigbee.h
