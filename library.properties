sentence=Drive external Zigbee / IEEE 802.15.4 radio modules (CC2530, ...) from an ArduinoNRF nRF52840 board.
paragraph=Host-side drivers for external 2.4 GHz IEEE 802.15.4 modules over a hardware UART. Ships an SDCC transceiver firmware for the AliExpress CC2530 module plus a raw-802.15.4 API (send / receive / promiscuous sniff). Flash the module firmware with the ArduinoNRF board package's built-in CC-Debugger - no external TI programmer required. Extensible to more modules and a future Z-Stack (full Zigbee PRO) backend.
category=Communication
