name=NiusZigbee
version=0.7.7
author=dunknowcoding (NiusRobotLab)
maintainer=dunknowcoding
sentence=Drive external Zigbee / IEEE 802.15.4 radio modules (CC2530, ...) from an ArduinoNRF nRF52840 board.
paragraph=Host-side Zigbee / IEEE 802.15.4 stack for external 2.4 GHz modules over a hardware UART. Ships an SDCC CC2530 MAC/PHY helper firmware (raw 802.15.4 send/receive, hardware PAN/address filtering, Auto ACK, CCA transmit, retries, promiscuous sniffing) and a growing native Zigbee PRO stack on the nRF52840: short-address MAC + association join, active scan + parent selection, AODV route discovery and multi-hop forwarding, AES-CCM* NWK and APS security, end-to-end acked delivery, APS fragmentation, ZDO discovery and network management (Mgmt_Lqi/Rtg), source binding, network-state persistence, Trust-Center key-transport tooling (AES-MMO/HMAC specialized keys), broadcast transaction table, sleepy-end-device queue + keep-alive, PAN-ID conflict frames, plus reusable Basic/OnOff cluster and reporting helpers. Flash the module firmware with the ArduinoNRF board package's built-in CC-Debugger - no external TI programmer required. Extensible to more modules and a future Z-Stack backend.
category=Communication
url=https://github.com/dunknowcoding/ArduinoNRF-Zigbee
architectures=nrf52
includes=NiusZigbee.h,ArduinoNRF_Zigbee.h
